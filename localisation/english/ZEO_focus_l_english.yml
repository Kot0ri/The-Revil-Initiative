l_english:
 ZEO_the_zabi_families_vision:0 "The Zabi's Family Vision"
 ZEO_the_zabi_families_vision_desc:0 "Degwin Sodo Zabi has envisioned Zeon as the center of a pan-Spacenoid cause for autonomy and independence, as well as evolution into Newtypes. However, Zeon's current status as an autonomous republic cannot acehive this. Therefore Degwin plans on restructuring it as a Principality, with his family as it's rulers."
 ZEO_degwins_age:0 "Degwin's Age"
 ZEO_degwins_age_desc:0 "Following the death of Zeon Zum Dekiun, Degwin Sodo Zabi has quickly sought to unify the Zeon people. Now however, his age has begun to hinder him, and he must choose an heir. While they will not take full authority until Degwin's death, they will grow increasingly in power. Currently the one in the best position to succed Degwin is Gihren, however, he may try to usurp Degwin's power even before his death."
 ZEO_designating_an_heir:0 "Designating an Heir"
 ZEO_designating_an_heir_desc:0 "It has been decided that instead of waiting for Garma to mature and tkae the mantle of heir, that one of the older Zabi sibilings should take the mantle. This will provide a more stable succesion, even if it does not allow for Degwin to orchestrate the nation for his favorite child."
 ZEO_sibling_rivalry:0 "Sibiling Rivalry"
 ZEO_sibling_rivalry_desc:0 "The three eldest children of Degwin: Gihren, Kycilia, and Dolze, haven begun competing for power. This is primarly between Gihren and Kycilia, who both possess desire for political rule of Zeon, compared to Dolze, who only desires military command. This leaves the Zeon amdinistration in a precarius position of vying factions."
 ZEO_gihrens_speeches:0 "Gihren's Speeches"
 ZEO_gihrens_speeches_desc:0 "Gihren Zabi possesses a great oratory skill, one far exceed all other politicians. As such he is a great figure to unite the people and lead them fowards."
 ZEO_ghirens_inner_circle:0 "Gihren's Inner Circle"
 ZEO_ghirens_inner_circle_desc:0 "Gihren has built up a cult of personality around himself, and has been  centrlaizing power within Zeon around himself. Now, even though the civil and military admistrations remain unchanged, they are little more than window dressing. If someone wants status or authority in Zeon, they best make freinds with Gihren. As such he has gathered a close circle of sycophants and puppets to carry out his desires."
 ZEO_cult_of_the_supreme_commander:0 "Cult of the Supreme Commander"
 ZEO_cult_of_the_supreme_commander_desc:0 "Gihren is an infalliable figure of the Zeon cause. His reputation cannot be tarnished in any way, any criticism of his character is equivalent to treason. Citizens of Zeon, nay, any Spacenoid should gladly lay down their life for the Supreme Commander."
 ZEO_acknowledge_glemy:0 "Acknowledge Glemy"
 ZEO_acknowledge_glemy_desc:0 "Gihren has sired several illegitamte children from various mistresses, however one in specific stands above the rest. Glemy is currently under the care of the Toto family, who took him on in order to regain their wealth and status, which they had all but lost prior to his adoption. While they show him love and care, the time to return him to his father is now."
 ZEO_prince_of_space:0 "Prince of Space"
 ZEO_prince_of_space_desc:0 "As the oldest child of Zeon Zum Deikun, it is fitting that Casval shall be made our new leader. He is educated in his father's teachings and we see a world fit for Newtypes be made."
 ZEO_there_are_no_liars_in_zeon:0 "There are no liars in Zeon"
 ZEO_there_are_no_liars_in_zeon_desc:0 "Dealing with the Federation is our top priority if we seek freedom for all spacenoids. Space alone does not yet possess the strength to defeat the Earth. Rather we should exploit the divisions within Earth to turn it against itself."
 ZEO_two_worlds_two_tomorrows:0 "Two Worlds Two Tomorrows"
 ZEO_two_worlds_two_tomorrows_desc:0 "Prioritizing the unification of space will be necessary if we ever seek to be able to stand agaisnt the Federation and acheive Deikun's Newtype evolution. By cooperating with the Moon and other Sides we can lay a foundation for a system to rival that of the Federation."
 ZEO_reach_out_to_earth_contacts:0 "Reach out to Earth Contacts"
 ZEO_reach_out_to_earth_contacts_desc:0 "We need to etshablish connections with as many anti-federal groups and roganizations as possbile before we can enact our plan to overthrow them."
 ZEO_the_reckoning:0 "The Reckoning" 
 ZEO_the_reckoning_desc:0 "Now is the time to strike!, now that suficient anti-federtaion forces have been mustered we can knock them down from the inside, without a drop of Zeon blood being spilt."
 ZEO_those_that_survive:0 "Those that Survive" 
 ZEO_those_that_survive_desc:0 "It seems that our compatriots fighting the Federation are increasingly being pushed onto the backfoot, we will need to escalate the conflict by lend leasing equipment and sending volunteers to them."
 ZEO_heirs_to_the_stars:0 "Heirs to the Stars"
 ZEO_heirs_to_the_stars_desc:0 "Only by presenting a united front agaisnt the Earth can we unite Space. This does mean we will have to take a more pragmactic apporach to our domestic sphere. Supporting moderates who propose to forgive former Zabists, atleast those which were not fanatical, in order to bring them into the government and military will be made a priority."
 ZEO_footsteps_of_zeon:0 "Footsteps of Zeon"
 ZEO_footsteps_of_zeon_desc:0 "Now the time has come for Deikun's heir to fufill his dream of a world inhabitied by Newtypes. By putting an end to the tyranny of the Federation space can now finally begin its destined evolution."
 