l_english:
 ZEO_the_zabi_families_vision:0 "The Zabi's Family Vision"
 ZEO_the_zabi_families_vision_desc:0 "Degwin Sodo Zabi has envisioned Zeon as the center of a pan-Spacenoid cause for autonomy and independence, as well as evolution into Newtypes. However, Zeon's current status as an autonomous republic cannot acehive this. Therefore Degwin plans on restructuring it as a Principality, with his family as it's rulers."
 ZEO_degwins_age:0 "Degwin's Age"
 ZEO_degwins_age_desc:0 "Following the death of Zeon Zum Dekiun, Degewin Sodo Zabi has quickly sought to unify the Zeon people. Now however, his age has begun to cacth up to him, and he must choose an heir. While they will not take full authority until Degwin's death, they will grow increasingly in power. Currently the one in the best position to succed Degwin is Gihren, however, he is a dangerous man, and may try to usurp Degewin's power even before his death."
 ZEO_designating_an_heir:0 "Designating an Heir"
 ZEO_designating_an_heir_desc:0 "It has been decided that instead of waiting for Garma to mature and tkae the mantle of heir, that one of the older Zabi sibilings should take the mantle. This will provide a more stable succesion, even if it does not allow for Degwin to orchestrate the nation for his favorite child."
 ZEO_sibling_rivalry:0 "Sibiling Rivalry"
 ZEO_sibling_rivalry_desc:0 "As with any family, sibilings form rivalires with eachother for attention. Place them in a hereditary system where only one can assume leadership, and they will vie for power equally so. Longstanding tradtions around succession can counteract this, however Zeon lacks this, being such a young nation, and only just recently possessing a monarchy. The three eldest children of Degwin, Gihren, Kycilia, and Dolze, haven begun competing for power. This is primarly between Gihren and Kycilia, who both possess desire for political rule of Zeon, compared to Dolze, who only desires military command."
 ZEO_ghirens_inner_circle:0 "Gihren's Inner Circle"
 ZEO_ghirens_inner_circle_desc:0 "Gihren has built up a cult of personality around himself, and has been increasingly centrlaizing power in the Priciplaity around himself. Now, even though the civil and military admistrations remain unchanged, they are little more than window dressing. If someone wants status or authority in Zeon, they best make freinds with Gihren. As such he has gathered a close circle of sycophants and puppets to carry out his desires to their benefit."
 ZEO_cult_of_the_supreme_commander:0 "Cult of the Supreme Commander"
 ZEO_cult_of_the_supreme_commander_desc:0 "Gihren is an infalliable figure of the Zeon cause. His reputation cannot be tarnished in any way, any criticism of his character is equivalent to treason. Citizens of Zeon, nay, any Spacenoid should gladly lay down their life for the Supreme Commander."
 ZEO_acknowledge_glemy:0 "Acknowledge Glemy"
 ZEO_acknowledge_glemy_desc:0 "Gihren has sired several illegitamte children from various mistresses, however one in specific stands above the rest. Glemy is currently under the care of the Toto family, who took him on in order to regain their wealth and status, which they had all but lost prior to his adoption. While they show him love and care, the time to return him to his father is now. Of ocurse a public ceremony will be necessary to bestow upon him the Zabi name."