l_english:
  zeon.01.t "Legacy of Zeon Zum Deikun"
	zeon.01.d "It has been six years now since the death of Zeon Zum Deikun, the man behind the ideals of Zeonism and the philospher behind the Newtype concept. There has been much controversy in both his death and its aftermath, with the actions fo the Zabi fmailiy coming into question. Their actions in the immediate fallout of his death, combined with their acquistion of power have fostered many critics. Because of this, Gihren Zabi launched a purge of their most outspoken critics, leading to thousands being killed, imprisoned, or exiled."
  zeon.01.a "Whatever their faults, the Zabis have guided us safely."
  zeon.01.b "We must remain caustious of even our own leaders."
