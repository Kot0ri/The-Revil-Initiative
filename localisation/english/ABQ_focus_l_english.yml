ABQ_mobile_suit_development_grounds:0 "Mobile Suit Development Grounds"
ABQ_mobile_suit_development_grounds_desc:0 "A Baoa Qu has been designated as a research and development site. As such testing of prototypes weapons will begin immediately."
ABQ_zeong_project:0 "Zeong Project"
ABQ_zeong_project_desc:0 "Completion of the MS-16X project, codenamed Zeong, should take priority. The Zeong is the culmination of Zeon Mobile Suit and Newtype technolgy, and has been developed from several experimental units. By prioritizing the completion of the Zeon, to be renamed the MSN-02, we can truly being the widescale prodcution of Newtype use weapons for the Newtype corps."