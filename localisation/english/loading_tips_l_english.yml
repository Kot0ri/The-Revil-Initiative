l_english:
LOADING_TIP_0:0 "May you bask in the glory of victory!! \n- Char Aznable"
LOADING_TIP_1:0 "You were a good pilot. But that's war. \n- Quattro Bajeena"
LOADING_TIP_2:0 "Looks like I'm not obsolete yet. \n- Quattro Bajeena"
LOADING_TIP_3:0 "They didn't call me the Red Comet for nothing. \n- Quattro Bajeena"
LOADING_TIP_4:0 "The Titans have the power, and therefore we have the right. \n- Jerid Meesa"
LOADING_TIP_5:0 "I just want to grasp the world in my own hands. \n- Jerid Meesa"
LOADING_TIP_6:0 "A rose for you. Your duty is to fight for this flower. \n- Haman Karn"
LOADING_TIP_7:0 "Greatness is achieved through the pursuit of greatness. \n- Glemy Toto"
LOADING_TIP_8:0 "The masses will accept the rule of a dictator, so long as it leads to peace. \n- Glemy Toto"
LOADING_TIP_9:0 "If one calls upon Venus, she may well bring Mars along! \n- Glemy Toto"
LOADING_TIP_10:0 "An ambition to rule the world will only lead to your destruction. \n- Glemy Toto"
LOADING_TIP_11:0 "People like you have no passion, no drive! Get out of my sight! \n- Glemy Toto"
LOADING_TIP_12:0 "So long as a warrior has life, he must fight. \n- Quattro Bajeena"
LOADING_TIP_13:0 "If you could go to space you could understand... There was hope between the stars. \n- Char Aznable"
LOADING_TIP_14:0 "Char Aznable says... let the purger begin. \n- Char Aznable"
LOADING_TIP_15:0 "I won't be lectured by someone who's manipulated by masses! \n- Char Aznable"
LOADING_TIP_16:0 "You have your ambitions... And I'm the one who can make them a reality. \n- Paptimus Scirocco"
LOADING_TIP_17:0 "My duty is to free all souls bound by gravity. \n- Paptimus Scirocco"
LOADING_TIP_18:0 "People need to be properly guided. They need an absolute leader to guide them. \n- Paptimus Scirocco"
LOADING_TIP_19:0 "I won't die alone. I'll drag your soul into hell with me, Kamille Bidan. \n- Paptimus Scirocco"
LOADING_TIP_20:0 "Glory to the Principality of Zeon!!! \n- Garma Zabi"
LOADING_TIP_21:0 "Understand - even if one man breaks through, head for the Axis Fleet so that all future generations will know the truth of the battle being fought. \n- Anavel Gato"
LOADING_TIP_22:0 "I am merely an observer of history. \n- Paptimus Scirocco"
LOADING_TIP_23:0 "Humanity has only ever been run by a select few geniuses. \n- Paptimus Scirocco"
LOADING_TIP_24:0 "Victory is the greatest tribute we can pay those who sacrifice their lives for us! Rise, our people, Rise! Take your sorrow, and turn it into anger! Zeon thirsts for the strength of its people! \n- Gihren Zabi"
LOADING_TIP_25:0 "My countrymen! You 150 million citizens of Zeon, our fight has only just begun we must continue to march onwards, together in perfect unison! and we will not cease until we have victory! \n- Gihren Zabi"
LOADING_TIP_26:0 "For Evil, the wages of Evil, For Sin, the Wages of Sin! \n- Mashymre Cello"
LOADING_TIP_27:0 "You Can't Kill Me, I'll fight until the Flesh is ripped off my Bones!	\n- Mashymre Cello"
LOADING_TIP_28:0 "All of humanity will awaken as Newtypes, it's only a matter of time. \n- Quattro Bajeena"
LOADING_TIP_29:0 "The truth of history... cannot be erased by anyone! \n- Jean-Luc Duval"
LOADING_TIP_30:0 "As of now I'm Lieutenant Quattro Bajeena. Nothing more, nothing less. \n- Quattro Bajeena"
LOADING_TIP_31:0 "I am, and always have been, my own man. \n- Quattro Bajeena"
LOADING_TIP_32:0 "Don't you know only humans can feel shame? \n- Quattro Bajeena"
LOADING_TIP_33:0 "The proof of our might will forever be etched in your minds. \n- Haman Karn"
LOADING_TIP_34:0 "Everyone! So that we may forge our own path and establish a government for the refugees. I ask you, lend me your great strength for just a little while longer! When we've succeeded, I will then be able to join my father, Zeon! \n- Casval Rem Deikun"
LOADING_TIP_35:0 "For the sake of Neo-Zeon's eternal Destiny! \n- Haman Karn"
LOADING_TIP_36:0 "The Earth belongs to the Titans. I won't just anyone have it! \n- Jerid Meesa"
